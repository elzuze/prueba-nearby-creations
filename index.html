<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Creations — Test Deploy</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --fg: #f0ede6;
    --accent: #b8ff57;
    --muted: rgba(240,237,230,0.2);
    --border: rgba(240,237,230,0.08);
  }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Syne', sans-serif;
    overflow-x: hidden;
  }

  /* grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    gap: 0;
  }

  /* top tag */
  .tag {
    font-family: 'Syne Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.35rem 1rem;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.2s forwards;
  }

  /* main heading */
  h1 {
    font-size: clamp(3.5rem, 12vw, 9rem);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(.16,1,.3,1) 0.4s forwards;
  }

  h1 span {
    color: var(--accent);
    display: block;
  }

  /* description */
  p.desc {
    font-family: 'Syne Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-align: center;
    max-width: 420px;
    line-height: 1.8;
    margin-bottom: 3.5rem;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.7s forwards;
  }

  /* status badge */
  .status {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-family: 'Syne Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--fg);
    opacity: 0;
    animation: fadeUp 0.6s ease 0.9s forwards;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s ease infinite;
  }

  /* divider */
  .divider {
    width: 1px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, var(--muted), transparent);
    margin: 3rem 0;
    opacity: 0;
    animation: fadeIn 0.6s ease 1.1s forwards;
  }

  /* info grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 600px;
    opacity: 0;
    animation: fadeUp 0.6s ease 1.2s forwards;
  }

  .cell {
    background: var(--bg);
    padding: 1.5rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .cell-label {
    font-family: 'Syne Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .cell-value {
    font-size: 1rem;
    font-weight: 700;
    color: var(--fg);
  }

  .cell-value.green { color: var(--accent); }

  /* corner decorations */
  .corner {
    position: fixed;
    width: 20px; height: 20px;
    z-index: 2;
    opacity: 0;
    animation: fadeIn 0.4s ease 1.5s forwards;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: rgba(184,255,87,0.3);
  }
  .corner::before { width: 100%; height: 1px; top: 0; left: 0; }
  .corner::after  { width: 1px; height: 100%; top: 0; left: 0; }
  .corner.tl { top: 1.5rem; left: 1.5rem; }
  .corner.tr { top: 1.5rem; right: 1.5rem; transform: scaleX(-1); }
  .corner.bl { bottom: 1.5rem; left: 1.5rem; transform: scaleY(-1); }
  .corner.br { bottom: 1.5rem; right: 1.5rem; transform: scale(-1); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.8); }
  }

  @media (max-width: 500px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="container">
  <div class="tag">HOLA
    
  </div>

  <h1>DEPLOY<span>exitoso.</span></h1>

  <p class="desc">
HOLAAAA  </p>

  <div class="status">
    <div class="dot"></div>
    Proyecto en línea
  </div>

  <div class="divider"></div>

  <div class="grid">
    <div class="cell">
      <span class="cell-label">Estado</span>
      <span class="cell-value green">✓ Online</span>
    </div>
    <div class="cell">
      <span class="cell-label">Plataforma</span>
      <span class="cell-value">GitHub Pages</span>
    </div>
    <div class="cell">
      <span class="cell-label">Herramienta</span>
      <span class="cell-value">Nearby</span>
    </div>
  </div>
</div>

</body>
</html>
